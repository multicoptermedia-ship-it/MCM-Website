name: Import MCM website image assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-images.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import selected images from the current MCM website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          download() {
            local src="$1"; local dst="$2"
            echo "Importing $src -> $dst"
            curl --fail --location --retry 3 --silent --show-error "$src" -o "assets/images/$dst"
          }
          download 'https://fotos-pur.de/img/MCM-2017SchlossDyck4.jpg' 'hero.jpg'
          download 'https://fotos-pur.de/img/MCM-Copter2.JPG' 'inspection.jpg'
          download 'https://fotos-pur.de/img/MissionPlanning3.jpg' 'survey.jpg'
          download 'https://fotos-pur.de/img/defekte-solarzelle.jpeg' 'solar-thermal.jpg'
          download 'https://fotos-pur.de/img/MCM-Copter3.JPG' 'special-uav.jpg'
          download 'https://fotos-pur.de/img/MCM-RTK1.webp' 'rtk.jpg'
          download 'https://fotos-pur.de/img/MCM-baudoku1.jpg' 'construction.jpg'
          download 'https://fotos-pur.de/img/MCM-NDVI.jpg' 'agriculture.jpg'
          download 'https://fotos-pur.de/img/3D-Arch%C3%A4ologie.png' 'archaeology.png'
          download 'https://fotos-pur.de/img/MCM-Regal1.JPG' 'industrial-indoor.jpg'
          download 'https://fotos-pur.de/img/Auto-FLIR2_neu.jpg' 'thermal-search.jpg'
          download 'https://fotos-pur.de/img/MCM-Flieger1.JPG' 'uav-flight.jpg'
          download 'https://fotos-pur.de/img/MCM_0262.JPG' 'uav-field.jpg'
          download 'https://fotos-pur.de/img/MCM-WP1.jpg' 'energy.jpg'
          download 'https://fotos-pur.de/img/uav1.jpeg' 'uav-platform.jpg'
      - name: Commit imported images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Add MCM image assets from current website'
          git push
